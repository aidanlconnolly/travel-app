<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Itinerary — Travel Planner</title>
  <!-- Replace with your Google Maps API key -->
  <meta name="google-maps-key" content="AIzaSyDC4ADeX7f7jJ8kwkVlQ0bsyKTaebHtf_c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/itinerary.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>

<!-- Print-only header (hidden on screen) -->
<div class="print-header"></div>

<div class="itinerary-page">

  <!-- ── Header ──────────────────────────────── -->
  <header class="itinerary-header">
    <a href="index.html" class="back-btn">← Trips</a>
    <h1 class="trip-title">Loading…</h1>
    <div class="trip-meta-pills"></div>
    <div class="header-actions">
      <span class="gen-status" style="font-size:.8rem;color:var(--text-muted)"></span>
      <select id="currency-select" class="btn btn-ghost" style="padding:6px 10px">
        <option value="USD">USD $</option>
        <option value="EUR">EUR €</option>
        <option value="GBP">GBP £</option>
        <option value="JPY">JPY ¥</option>
        <option value="AUD">AUD A$</option>
        <option value="CAD">CAD C$</option>
        <option value="CHF">CHF Fr</option>
        <option value="INR">INR ₹</option>
      </select>
      <button id="btn-fullscreen" class="btn btn-ghost" title="Fullscreen itinerary (hide map and panel)">⛶ Full</button>
      <button id="btn-toggle-map" class="btn btn-ghost" title="Hide map">🗺️ Map</button>
      <button id="btn-toggle-sidebar" class="btn btn-ghost" title="Hide packing & tips">📋 Panel</button>
      <button id="btn-regenerate" class="btn btn-ghost" title="Regenerate itinerary">↺ Regen</button>
      <button id="btn-share" class="btn btn-ghost" title="Share trip">🔗 Share</button>
      <button id="btn-export" class="btn btn-ghost" title="Export as JSON">⬇ Export</button>
      <button id="btn-print" class="btn btn-ghost" title="Print / Save as PDF">🖨 Print</button>
      <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <!-- ── Main (map + day columns) ────────────── -->
  <main class="itinerary-main">
    <!-- Map -->
    <div id="map">
      <div class="map-placeholder">
        <span style="font-size:2rem">🗺️</span>
        <p>Map loading…</p>
      </div>
    </div>

    <!-- Horizontal resizer between map and day columns -->
    <div class="resizer resizer-h" id="resizer-map" title="Drag to resize map"></div>

    <!-- Day columns -->
    <div id="day-columns">
      <!-- Rendered by main.js -->
    </div>
  </main>

  <!-- Vertical resizer between main and sidebar -->
  <div class="resizer resizer-v" id="resizer-sidebar" title="Drag to resize panel"></div>

  <!-- ── Right sidebar: packing list + tips ───── -->
  <aside id="packing-panel">
    <div class="sidebar-section" id="sidebar-packing">
      <div class="panel-header">
        <h3>🎒 Packing List</h3>
        <button class="panel-toggle" id="packing-export-btn" title="Export packing list">⬇ PDF</button>
      </div>
      <div class="packing-categories">
        <div style="padding:24px;text-align:center;color:var(--text-muted);font-size:.875rem">
          Packing list generates after itinerary loads…
        </div>
      </div>
    </div>
    <div class="sidebar-section" id="sidebar-tips">
      <div class="panel-header">
        <h3>💡 Tips for visiting</h3>
      </div>
      <div class="tips-list">
        <div style="padding:18px;text-align:center;color:var(--text-muted);font-size:.875rem">
          Tips appear after itinerary loads…
        </div>
      </div>
    </div>
  </aside>

  <!-- ── Bottom: budget tracker ───────────────── -->
  <section id="budget-panel" class="collapsed">
    <div class="budget-header">
      <h3>💰 Budget</h3>
      <input type="number" id="trip-budget-input" placeholder="Set total budget ($)" min="0"
        style="padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text-primary);width:180px;font-size:.8125rem">
      <div class="budget-total-display">$0 estimated</div>
      <span style="margin-left:auto;font-size:.75rem;color:var(--text-muted)">▲ click to expand</span>
    </div>
    <div class="budget-body">
      <div class="budget-chart-wrap">
        <canvas id="budget-chart" width="120" height="120"></canvas>
      </div>
      <div class="budget-breakdown">
        <!-- Rendered by budget.js -->
      </div>
    </div>
  </section>

</div>

<!-- ── Share modal ──────────────────────────── -->
<div class="modal-overlay" id="share-modal" role="dialog" aria-modal="true">
  <div class="modal">
    <h2>Share this trip</h2>
    <p style="color:var(--text-secondary);font-size:.875rem;margin-bottom:16px">Anyone with this link can view your itinerary.</p>
    <div class="form-group">
      <label>Shareable link</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="share-url-input" readonly style="flex:1">
        <button id="share-url-copy" class="btn btn-ghost">Copy</button>
      </div>
    </div>
    <div id="qr-container" style="margin:16px auto;width:fit-content"></div>
    <button id="share-modal-close" class="btn btn-ghost" style="width:100%;margin-top:8px">Close</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
